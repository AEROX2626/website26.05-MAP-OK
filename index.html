<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת גלריה חכמה - עם סרגל התקדמות ומובייל</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .gallery-container {
            width: 100%;
            height: 220px;
            position: relative;
            cursor: ew-resize;
            /* מניעת פעולות מגע ברירת מחדל כמו רענון משיכה במובייל כשמחליקים על התמונה */
            touch-action: pan-y; 
        }

        .dynamic-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .gallery-counter {
            position: absolute;
            bottom: 15px;
            right: 12px;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            z-index: 2;
        }

        /* עיצוב פס ההתקדמות (הסרגל) */
        .progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.4);
            z-index: 2;
        }

        .progress-fill {
            height: 100%;
            background-color: #333; /* צבע הסרגל עצמו - אפשר לשנות לכל צבע שתבחר */
            width: 0%; 
            transition: width 0.15s ease-out; /* אנימציה חלקה כשפס מתמלא */
        }

        .card-info {
            padding: 20px;
        }

        .card-title {
            font-size: 18px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .card-price {
            font-size: 16px;
            color: #666;
        }
    </style>
</head>
<body>

    <h1>מבחר מקומות אירוח</h1>

    <div class="grid-container">
        
        <div class="card">
            <div class="gallery-container" 
                 data-images="https://picsum.photos/id/1018/600/400,https://picsum.photos/id/1015/600/400,https://picsum.photos/id/1019/600/400,https://picsum.photos/id/1016/600/400">
                <img src="https://picsum.photos/id/1018/600/400" alt="תמונת המקום" class="dynamic-image">
                
                <div class="gallery-counter">
                    תמונה <span class="current-img">1</span> מתוך <span class="total-imgs">4</span>
                </div>
                
                <!-- הסרגל החדש -->
                <div class="progress-bar-container">
                    <div class="progress-fill"></div>
                </div>
            </div>
            
            <div class="card-info">
                <div class="card-title">סוויטה מול הנוף</div>
                <div class="card-price">החל מ-₪850 ללילה</div>
            </div>
        </div>

        <div class="card">
            <div class="gallery-container" 
                 data-images="https://picsum.photos/id/1043/600/400,https://picsum.photos/id/1044/600/400,https://picsum.photos/id/1045/600/400,https://picsum.photos/id/1048/600/400,https://picsum.photos/id/1049/600/400">
                <img src="https://picsum.photos/id/1043/600/400" alt="תמונת המקום" class="dynamic-image">
                
                <div class="gallery-counter">
                    תמונה <span class="current-img">1</span> מתוך <span class="total-imgs">5</span>
                </div>
                
                <div class="progress-bar-container">
                    <div class="progress-fill"></div>
                </div>
            </div>
            
            <div class="card-info">
                <div class="card-title">בקתת עץ קלאסית</div>
                <div class="card-price">החל מ-₪600 ללילה</div>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const galleries = document.querySelectorAll('.gallery-container');

            galleries.forEach(container => {
                const imgElement = container.querySelector('.dynamic-image');
                const currentSpan = container.querySelector('.current-img');
                const totalSpan = container.querySelector('.total-imgs');
                const progressFill = container.querySelector('.progress-fill');
                
                const imagesString = container.getAttribute('data-images');
                if (!imagesString) return;
                
                const imageArray = imagesString.split(',');
                const totalImages = imageArray.length;
                
                totalSpan.textContent = totalImages;

                // אתחול הסרגל לתמונה הראשונה בעת טעינת הדף
                progressFill.style.width = `${(1 / totalImages) * 100}%`;

                imageArray.forEach(src => {
                    const img = new Image();
                    img.src = src;
                });

                // פונקציה משותפת שמטפלת גם בעכבר וגם במגע
                const handleInteraction = (e) => {
                    // קבלת המיקום: אם זה אירוע מגע ניקח את האצבע הראשונה, אחרת את העכבר
                    const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                    
                    const rect = container.getBoundingClientRect();
                    let relativeX = (clientX - rect.left) / rect.width;
                    
                    // התאמה ל-RTL (ככל שזזים שמאלה מתקדמים בתמונות)
                    relativeX = 1 - relativeX;

                    let imageIndex = Math.floor(relativeX * totalImages);
                    imageIndex = Math.max(0, Math.min(imageIndex, totalImages - 1));

                    if (imgElement.src !== imageArray[imageIndex]) {
                        imgElement.src = imageArray[imageIndex];
                        currentSpan.textContent = imageIndex + 1;
                        
                        // עדכון רוחב הסרגל באחוזים
                        progressFill.style.width = `${((imageIndex + 1) / totalImages) * 100}%`;
                    }
                };

                // האזנה לאירועי עכבר (מחשב)
                container.addEventListener('mousemove', handleInteraction);
                
                // האזנה לאירועי מגע (מובייל)
                container.addEventListener('touchmove', handleInteraction, { passive: true });

                // חזרה לתמונה הראשונה כשהעכבר יוצא (אופציונלי - עובד רק במחשב)
                container.addEventListener('mouseleave', () => {
                    imgElement.src = imageArray[0];
                    currentSpan.textContent = 1;
                    progressFill.style.width = `${(1 / totalImages) * 100}%`;
                });
            });
        });
    </script>
</body>
</html>
